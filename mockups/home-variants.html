<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ТЛС Путешествия — варианты главной</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <symbol id="i-diamond" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
      <path d="M12 3.5 20.5 10 12 20.5 3.5 10Z"/><path d="M3.5 10h17M8 3.8 12 10l4-6.2"/>
    </symbol>
    <symbol id="i-suitcase" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <rect x="4" y="8" width="16" height="12" rx="2"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8M9 12v5m3-5v5m3-5v5"/>
    </symbol>
    <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
      <path d="M4.5 4.5h10a2 2 0 0 1 2 2V13a2 2 0 0 1-2 2H8l-3.5 2.5Z"/>
      <path d="M9 18.5h7.5l3 2.5V10.5a2 2 0 0 0-2-2h-1"/>
    </symbol>
    <symbol id="i-profile" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <circle cx="12" cy="8" r="3.2"/><path d="M5.5 19.5c0-3.7 2.7-6 6.5-6s6.5 2.3 6.5 6"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <circle cx="11" cy="11" r="6"/><path d="m16 16 4.5 4.5"/>
    </symbol>
    <symbol id="i-folder" viewBox="0 0 24 24" fill="currentColor">
      <path d="M4.2 8.2h6.2l1.2-1.4h8.2c.9 0 1.6.7 1.6 1.6v9.4c0 .9-.7 1.6-1.6 1.6H4.2c-.9 0-1.6-.7-1.6-1.6V9.8c0-.9.7-1.6 1.6-1.6Zm.3 2.1v8.2h15V10.3H4.5Z"/>
    </symbol>
    <symbol id="i-phone" viewBox="0 0 24 24" fill="currentColor">
      <path d="M8.2 16.8c2.4 2.2 5.6 3.5 9 3.2.7-.1 1.2-.7 1.3-1.4l.2-1.6c0-.5-.3-1-.8-1.2l-2.4-1c-.4-.2-.9-.1-1.2.2l-.7.8c-.2.2-.5.3-.8.2-1.3-.5-2.5-1.4-3.4-2.6-.2-.3-.1-.6.1-.8l.8-.7c.3-.3.4-.8.2-1.2l-1-2.4c-.2-.5-.7-.8-1.2-.8l-1.6.2c-.7.1-1.3.6-1.4 1.3-.3 3.4 1 6.6 3.2 9Z"/>
      <path d="M15.2 4.2c2.1.4 3.9 1.7 4.9 3.5.3.5.1 1.1-.4 1.3-.5.3-1.1.1-1.3-.4-.7-1.3-1.9-2.2-3.4-2.5-.5-.1-.9-.6-.8-1.1.1-.5.6-.9 1-.8Z" opacity=".9"/>
      <path d="M15.4 6.8c1.1.3 2 1 2.5 1.9.2.5 0 1-.5 1.2-.4.2-1 0-1.2-.4-.3-.5-.8-.9-1.4-1-.5-.1-.8-.6-.7-1.1.1-.5.6-.8 1.3-.6Z" opacity=".75"/>
    </symbol>
    <symbol id="i-avatar" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="24" fill="#E4EAF3"/><circle cx="24" cy="18" r="8" fill="#8A929C"/>
      <path d="M8 42c2-10 8-14 16-14s14 4 16 14" fill="#8A929C"/>
    </symbol>
    <symbol id="i-plane" viewBox="0 0 24 24" fill="currentColor">
      <path d="M21 12.5 14.2 14l-3.4 6.4-.9-.5 1.6-5.9L3 11.8l.6-1.1 8.1 1.7L14.2 5l1 .4-1.5 6.2L21 12.5Z"/>
    </symbol>
  </svg>

  <main class="page home-exploration">
    <header class="page-header">
      <nav class="site-nav" aria-label="Разделы макетов">
        <a href="index.html">AS IS</a>
        <a href="home-variants.html" class="on">TO BE MAIN</a>
        <a href="map-nearby.html">TO BE MAP</a>
      </nav>
      <h1>ТЛС Путешествия TO BE MAIN</h1>
    </header>

    <div id="variant-list"></div>
    <p class="footer"><a href="index.html">as-is</a> · mockups/home-variants.html</p>
  </main>

  <script>
    const categories = [
      { name: 'Акции', className: 'cat-promo' },
      { name: 'Авиабилеты', className: 'cat-air' },
      { name: 'Рестораны', className: 'cat-rest' },
      { name: 'Отели', className: 'cat-hotel' },
      { name: 'Привилегии', className: 'cat-priv' },
      { name: 'Визы', className: 'cat-visa' },
      { name: 'ВНЖ', className: 'cat-residence' },
      { name: 'Туры', className: 'cat-tour' },
      { name: 'Медицина', className: 'cat-med' },
      { name: 'Страхование', className: 'cat-insurance' },
      { name: 'Сервисы', className: 'cat-service' },
      { name: 'Авто', className: 'cat-auto' }
    ];

    const eliteStories = [
      { name: 'Aman Tokyo', short: 'Aman', className: 'cat-hotel' },
      { name: 'George V', short: 'George V', className: 'cat-hotel' },
      { name: 'The Ritz', short: 'Ritz', className: 'cat-hotel' },
      { name: 'Nobu', short: 'Nobu', className: 'cat-rest' },
      { name: 'Cipriani', short: 'Cipriani', className: 'cat-rest' },
      { name: 'Le Bristol', short: 'Bristol', className: 'cat-hotel' },
      { name: 'Mandarin', short: 'Mandarin', className: 'cat-hotel' },
      { name: 'L’Ambroisie', short: 'Ambroisie', className: 'cat-rest' },
      { name: 'Burj Al Arab', short: 'Burj', className: 'cat-hotel' },
      { name: 'Sketch', short: 'Sketch', className: 'cat-rest' },
      { name: 'La Pergola', short: 'Pergola', className: 'cat-rest' },
      { name: 'Gucci Osteria', short: 'Gucci', className: 'cat-rest' }
    ];

    const variants = [
      /* —— Offers + «Сервисы» —— */
      { id: 1, group: 'offers', name: 'Offers · stack', note: 'UIScrollView: заголовок «Специальные предложения» → горизонтальный UICollectionView (wide cards, peek, scale/fade краёв) → разделитель «Сервисы» → вертикальный stack фото-баннеров категорий', layout: 'offers-wglobe-stack', wglobe: 'offer-peek', plaques: 'stack', sep: 'line', offersTune: 'v121' },
      { id: 2, group: 'offers', name: 'Offers · квадраты', note: 'Как V1, но категории — UICollectionView grid 2 колонки, ячейки aspectRatio 1:1', layout: 'offers-wglobe-stack', wglobe: 'offer-peek', plaques: 'square', sep: 'line', offersTune: 'v121' },
      { id: 3, group: 'offers', name: 'Offers · сетка 2 кол.', note: 'Как V1, категории — равномерная сетка 2 колонки (одинаковая высота ячеек)', layout: 'offers-wglobe-stack', wglobe: 'offer-peek', plaques: 'grid', sep: 'line', offersTune: 'v121' },
      { id: 4, group: 'offers', name: 'Offers · wide+pair', note: 'Как V1, категории — чередование: full-width баннер, затем ряд из 2 компактных', layout: 'offers-wglobe-stack', wglobe: 'offer-peek', plaques: 'alternating', sep: 'line', offersTune: 'v121' },
      { id: 5, group: 'offers', name: 'Offers · magazine', note: 'Как V1, категории — magazine: крупный блок 2×2 + мелкие плитки вокруг', layout: 'offers-wglobe-stack', wglobe: 'offer-peek', plaques: 'magazine', sep: 'line', offersTune: 'v121' },

      /* —— Каталог категорий —— */
      { id: 6, group: 'cats', name: 'Панорамная сетка', note: 'Сетка 2 колонки, низкие wide-плитки категорий на всю ширину ячейки', layout: 'grid-wide' },
      { id: 7, group: 'cats', name: 'Bento категорий', note: 'Только категории: bento-сетка 2 колонки со span tall/full-width', layout: 'bento-cats' },
      { id: 8, group: 'cats', name: 'Шахматная сетка', note: 'Сетка 2 колонки со смещением строк (staggered / masonry-like offset)', layout: 'staggered' },
      { id: 9, group: 'mosaic', name: 'L-угол', note: 'Повторяющийся L: 1 tall + 2 short в колонке справа', layout: 'bento-m3' },
      { id: 10, group: 'mosaic', name: 'Magazine', note: 'Крупная плитка на 2×2 + мелкие вокруг', layout: 'bento-m4' },
      { id: 11, group: 'mosaic', name: 'Полосы', note: 'Чередование full-width полосы и пары из 2 плиток', layout: 'bento-m5' },
      { id: 12, group: 'mosaic', name: '3 колонки', note: 'Узкая равномерная сетка 3 колонки', layout: 'bento-m6' },
      { id: 13, group: 'mosaic', name: 'Cascade', note: 'Каскад: tall, затем pair; повтор паттерна вниз', layout: 'bento-m8' },

      /* —— Stories rails —— */
      { id: 14, group: 'stories', name: 'Elite + сетка', note: 'Горизонтальные story-кружки (отели/рестораны) → сетка 2 кол. категорий', layout: 'stories-elite-grid', stories: 'elite' },
      { id: 15, group: 'stories', name: 'Rail fullscreen', note: 'Горизонтальный UICollectionView высоких portrait-карточек (почти fullscreen по высоте), snap по центру', layout: 'stories-rail', rail: 'default', stories: 'elite-rail' },
      { id: 16, group: 'stories', name: 'Rail compact', note: 'Как V15, но компактные карточки меньшей высоты/ширины', layout: 'stories-rail', rail: 'compact', stories: 'elite-rail' },

      /* —— Прочее —— */
      { id: 17, group: 'other', name: 'Lifestyle segments', note: 'UISegmentedControl (Travel / Dining / Docs) → контент сегмента ниже', layout: 'idea-segments' },
      { id: 18, group: 'other', name: 'Wide strip + bento', note: 'Горизонтальная лента wide stories → ниже bento-мозаика категорий', layout: 'hybrid-strip-mosaic', strip: 'classic', mosaic: 'bento-cats' },
      { id: 19, group: 'other', name: 'Offers frame + line', note: 'Блок спецпредложений в карточке-рамке → линия «Сервисы» → вертикальный stack категорий', layout: 'offers-wglobe-stack', wglobe: 'offer-peek', plaques: 'stack', sep: 'frame-line' },
      { id: 20, group: 'other', name: 'Offers frame + panel', note: 'Блок спецпредложений в рамке → категории в отдельной подложке-панели (stack)', layout: 'offers-wglobe-stack', wglobe: 'offer-peek', plaques: 'stack', sep: 'frame-panel' },

      /* —— V21: база «визитки» —— */
      { id: 21, group: 'cards', name: 'Визитки · база', note: 'Визитки категорий без фона стола, лёгкий угол; UICollectionView / grid', layout: 'card-plain' },

      /* —— V22: hero + сетка (бывш. V27), прежняя золотая обводка —— */
      { id: 22, group: 'hero', name: 'Hero + сетка', note: 'Одна wide-accent визитка → сетка 2 кол. ниже; обводка #c9a227', layout: 'card-hero-grid' }
    ];

    const svg = (id, cls = 'ico') => `<svg class="${cls}"><use href="#${id}"/></svg>`;
    const icoMask = (name) => `<span class="ico-mask ico-mask-${name}" aria-hidden="true"></span>`;

    function header() {
      return `
        <div class="status-bar"><span>13:12</span><span class="icons">Wi-Fi 74</span></div>
        <div class="top-bar">
          <div class="avatar-sm">${svg('i-avatar')}</div>
          <div class="icon-row">
            <div class="icon-btn">${icoMask('search')}</div>
            <div class="icon-btn">${icoMask('folder')}</div>
            <div class="icon-btn">${icoMask('phone')}</div>
          </div>
        </div>`;
    }

    function tabs(interactive = false) {
      const cls = interactive ? 'tab-bar anim-tabs' : 'tab-bar';
      return `<div class="${cls}">
        <div class="tab active" data-tab="0">${svg('i-diamond')}</div>
        <div class="tab" data-tab="1">${svg('i-suitcase')}</div>
        <div class="tab" data-tab="2">${svg('i-chat')}</div>
        <div class="tab" data-tab="3">${svg('i-profile')}</div>
        ${interactive ? '<span class="anim-tab-indicator"></span>' : ''}
      </div>`;
    }

    function banner(category, index, extra = '') {
      return `<div class="category-banner ${category.className} ${extra}">
        <span class="category-name">${category.name}</span>
        <span class="category-arrow">›</span>
      </div>`;
    }

    function hero() {
      return `<div class="category-hero">
        <span class="hero-kicker">Актуальное</span>
        <strong>Путешествуйте с привилегиями</strong>
        <span>Персональные предложения и сервис 24/7</span>
      </div>`;
    }

    function mapBlock() {
      return `<div class="category-map">
        <strong>Привилегии рядом</strong>
        <span class="map-dot d1"></span><span class="map-dot d2"></span><span class="map-dot d3"></span>
        <small>Москва · Сочи · Милан</small>
      </div>`;
    }

    function storiesCats() {
      return `<div class="stories-preview">
        ${categories.slice(0, 6).map((c) => `<div class="story-preview">
          <div class="story-preview-ring ${c.className}"></div><span>${c.name}</span>
        </div>`).join('')}
      </div>
      <div class="stories-note">Stories — категории</div>`;
    }

    function storiesElite(limit = 8) {
      return `<div class="stories-preview">
        ${eliteStories.slice(0, limit).map((s) => `<div class="story-preview">
          <div class="story-preview-ring ${s.className}"></div><span>${s.short}</span>
        </div>`).join('')}
      </div>
      <div class="stories-note">Stories — элитные отели и рестораны</div>`;
    }

    function storiesLarge() {
      return `<div class="stories-large-row">
        ${eliteStories.slice(0, 4).map((s) => `
          <div class="story-large-card ${s.className}">
            <span class="story-large-label">Story</span>
            <strong>${s.name}</strong>
          </div>`).join('')}
      </div>`;
    }

    function storiesRail(size = 'default', count = 4) {
      const list = eliteStories.slice(0, count);
      return `<div class="stories-rail-row rail-${size}">
        ${list.map((s) => `
          <div class="story-rail-card ${s.className}">
            <strong>${s.name}</strong>
            <em>Смотреть</em>
          </div>`).join('')}
      </div>`;
    }

    function storiesStrip(kind = 'classic', count = 5) {
      const list = eliteStories.slice(0, count);
      return `<div class="stories-strip-row strip-${kind}">
        ${list.map((s) => `
          <div class="story-strip-card ${s.className}">
            <strong>${s.name}</strong>
            <em>${s.className === 'cat-hotel' ? 'Отель' : 'Ресторан'}</em>
          </div>`).join('')}
      </div>`;
    }

    function storiesHGlobe(kind = 'scale', count = 6) {
      const list = eliteStories.slice(0, count);
      return `<div class="stories-hglobe-row hglobe-${kind}">
        ${list.map((s) => `
          <div class="story-hglobe-card ${s.className}">
            <strong>${s.short}</strong>
          </div>`).join('')}
      </div>`;
    }

    function storiesWGlobe(kind = 'classic', count = 6) {
      return `<div class="stories-wglobe-row wglobe-${kind}">
        ${eliteStories.slice(0, count).map((s) => `
          <div class="story-wglobe-card ${s.className}">
            <strong>${s.name}</strong>
            <em>${s.className === 'cat-hotel' ? 'Отель' : 'Ресторан'}</em>
          </div>`).join('')}
      </div>`;
    }

    function horizontalCats() {
      return `<div class="h-cats-row">
        ${categories.map((c) => `
          <div class="h-cat-card category-banner ${c.className}">
            <span class="category-name">${c.name}</span>
          </div>`).join('')}
      </div>`;
    }

    function categoryTabsBar(variant, activeIndex = 0) {
      const style = variant.tabsStyle ? ` cat-tabs-${variant.tabsStyle}` : '';
      const sticky = variant.stickyTabs ? ' is-sticky' : '';
      return `<div class="cat-tabs-row${style}${sticky}">
        ${categories.map((c, i) => `
          <button type="button" class="cat-tab${i === activeIndex ? ' on' : ''}" data-cat="${i}">${c.name}</button>
        `).join('')}
      </div>`;
    }

    function tabsBodyContent(body, activeCat) {
      const cat = categories[activeCat] || categories[0];
      const offers = eliteStories.slice(0, 6);
      if (body === 'list') {
        return `<div class="tabs-offer-list">
          ${offers.map((s) => `<div class="tabs-offer-row ${s.className}"><strong>${s.name}</strong><span>${cat.name}</span></div>`).join('')}
        </div>`;
      }
      if (body === 'dense') {
        return `<div class="idea-dense-list">
          ${offers.map((s) => `<div class="idea-dense-row"><strong>${s.name}</strong><span>${cat.name}</span></div>`).join('')}
        </div>`;
      }
      if (body === 'wide') return storiesStrip('classic', 5);
      if (body === 'square') return storiesStrip('square', 5);
      if (body === 'hglobe') return storiesHGlobe('scale', 6);
      if (body === 'wglobe') return storiesWGlobe('classic', 6);
      if (body === 'bento') return mosaicBlock('bento-cats');
      if (body === 'alternating') return mosaicBlock('alternating');
      if (body === 'twin') return mosaicBlock('bento-m2');
      if (body === 'magazine') return mosaicBlock('bento-m4');
      if (body === 'cascade') return mosaicBlock('bento-m8');
      if (body === 'panorama') return mosaicBlock('grid-wide');
      if (body === 'dual') {
        return `${storiesStrip('classic', 4)}${storiesStrip('square', 4)}`;
      }
      if (body === 'featured') {
        return `<div class="tabs-featured">
          <div class="tabs-featured-main category-banner ${cat.className}"><span class="category-name">${cat.name}</span></div>
          <div class="tabs-featured-side">
            ${offers.slice(0, 2).map((s) => `<div class="story-strip-card ${s.className}"><strong>${s.short}</strong></div>`).join('')}
          </div>
        </div>
        <div class="category-layout layout-grid">${categories.slice(0, 4).map((c, i) => banner(c, i)).join('')}</div>`;
      }
      if (body === 'split') {
        return `${storiesStrip('classic', 4)}
          <div class="tabs-offer-list">
            ${offers.slice(0, 4).map((s) => `<div class="tabs-offer-row ${s.className}"><strong>${s.name}</strong><span>${cat.name}</span></div>`).join('')}
          </div>`;
      }
      /* grid default */
      return `<div class="category-layout layout-grid">
        ${offers.map((s) => `
          <div class="category-banner ${s.className}"><span class="category-name">${s.short}</span><span class="category-arrow">›</span></div>
        `).join('')}
      </div>`;
    }

    function mosaicBlock(layoutName) {
      return `<div class="category-layout layout-${layoutName}">${categories.map((c, i) => banner(c, i)).join('')}</div>`;
    }

    function chips(list = categories) {
      return `<div class="idea-chips">${list.map((c) => `<span class="idea-chip">${c.name}</span>`).join('')}</div>`;
    }

    function categoryLayout(variant) {
      const all = categories.map((c, i) => banner(c, i)).join('');

      if (variant.layout === 'task-groups') {
        return `
          <h4 class="category-group-title">Подготовка</h4>
          <div class="category-grid">${categories.slice(5, 7).concat(categories.slice(8, 10)).map((c) => banner(c, categories.indexOf(c))).join('')}</div>
          <h4 class="category-group-title">Путешествие</h4>
          <div class="category-grid">${categories.slice(1, 4).concat(categories.slice(7, 8)).map((c) => banner(c, categories.indexOf(c))).join('')}</div>
          <h4 class="category-group-title">Lifestyle и сервис</h4>
          <div class="category-grid">${[categories[0], categories[4], categories[10], categories[11]].map((c) => banner(c, categories.indexOf(c))).join('')}</div>`;
      }

      if (variant.layout === 'groups') {
        return [0, 4, 8].map((start, group) => `
          <h4 class="category-group-title">${['Популярное', 'Документы и здоровье', 'Сервисы'][group]}</h4>
          <div class="category-group-row">${categories.slice(start, start + 4).map((c, i) => banner(c, start + i)).join('')}</div>`).join('');
      }

      if (variant.layout === 'stories-elite-grid') {
        return `<div class="category-layout layout-grid">${all}</div>`;
      }

      if (variant.layout === 'stories-large') {
        return `${storiesLarge()}<h4 class="category-group-title">Категории</h4>${chips()}`;
      }

      if (variant.layout === 'stories-featured') {
        return `<div class="category-layout layout-grid">${all}</div>`;
      }

      if (variant.layout === 'stories-mid') {
        return `
          <div class="category-layout layout-grid">${categories.slice(0, 4).map((c, i) => banner(c, i)).join('')}</div>
          ${storiesElite(6)}
          <div class="category-layout layout-grid">${categories.slice(4).map((c, i) => banner(c, i + 4)).join('')}</div>`;
      }

      if (variant.layout === 'stories-rail') {
        const size = variant.rail || 'default';
        const count = size === 'peek' || size === 'panorama' ? 3 : size === 'slim' || size === 'mixed' ? 5 : 4;
        return `${storiesRail(size, count)}
          <h4 class="category-group-title">Все категории</h4>
          <div class="category-layout layout-hero-list">${all}</div>`;
      }

      if (variant.layout === 'stories-strip') {
        return `${storiesStrip(variant.strip || 'classic')}
          <h4 class="category-group-title">Категории</h4>
          <div class="category-layout layout-grid">${all}</div>`;
      }

      if (variant.layout === 'stories-hglobe') {
        return `${storiesHGlobe(variant.hglobe || 'scale')}
          <p class="anim-hint">Горизонтальный скролл · центр выделен</p>

    function phone(variant, theme) {

      const heroBlock = variant.hero
        ? (variant.layout === 'anim-kenburns'
          ? `<div class="category-hero anim-kenburns-hero">

      const map = variant.map
        ? (variant.layout === 'anim-map-pins'
          ? `<div class="category-map anim-map">
              <strong>Привилегии рядом</strong>

      return `<div class="phone-wrap theme-phone-wrap">

    const groupLabels = {
      offers: 'Offers + Сервисы',
      cats: 'Каталог',
      mosaic: 'Мозаики',
      stories: 'Stories',

    let lastGroup = '';
    document.getElementById('variant-list').innerHTML = variants.map((variant) => {
      const divider = variant.group !== lastGroup

      return `${divider}

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function replayAnim(phoneEl) {
      if (reduceMotion || !phoneEl) return;
      phoneEl.classList.remove('is-animating');
      void phoneEl.offsetWidth;
      phoneEl.classList.add('is-animating');
    }

    document.querySelectorAll('.anim-demo').forEach((phoneEl) => {
      const io = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) replayAnim(phoneEl);
        });
      }, { threshold: 0.45 });
      io.observe(phoneEl);

      phoneEl.querySelectorAll('.story-preview').forEach((story) => {
        story.addEventListener('click', () => {
          const sheet = phoneEl.querySelector('.anim-story-sheet');
          const title = phoneEl.querySelector('.anim-story-title');
          if (!sheet) return;
          if (title) title.textContent = story.querySelector('span')?.textContent || 'Story';
          sheet.hidden = false;
          sheet.classList.add('is-open');
        });
      });
      phoneEl.querySelector('.anim-story-close')?.addEventListener('click', (e) => {
        e.stopPropagation();
        const sheet = phoneEl.querySelector('.anim-story-sheet');
        if (!sheet) return;
        sheet.classList.remove('is-open');
        sheet.hidden = true;
      });

      phoneEl.querySelector('.anim-flip-scene')?.addEventListener('click', () => {
        phoneEl.querySelector('.anim-flip-scene').classList.toggle('is-flipped');
      });

      const tabBar = phoneEl.querySelector('.anim-tabs');
      if (tabBar) {
        const indicator = tabBar.querySelector('.anim-tab-indicator');
        const move = (tab) => {
          tabBar.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
          tab.classList.add('active');
          if (indicator) {
            indicator.style.transform = `translateX(${tab.offsetLeft + tab.offsetWidth / 2 - 3}px)`;
          }
        };
        tabBar.querySelectorAll('.tab').forEach((tab) => {
          tab.addEventListener('click', () => move(tab));
        });
        const active = tabBar.querySelector('.tab.active');
        if (active) requestAnimationFrame(() => move(active));
      }

      phoneEl.querySelectorAll('.anim-chip-row').forEach((row) => {
        row.addEventListener('click', (e) => {
          const chip = e.target.closest('.anim-chip');
          if (!chip) return;
          row.querySelectorAll('.anim-chip').forEach((c) => c.classList.remove('on'));
          chip.classList.add('on');
        });
      });

      if (phoneEl.dataset.anim === 'anim-skeleton') {
        const skel = phoneEl.querySelector('.anim-skel-block');
        const content = phoneEl.querySelector('.anim-skel-content');
        const run = () => {
          if (!skel || !content) return;
          skel.hidden = false;
          content.hidden = true;
          content.classList.remove('is-shown');
          setTimeout(() => {
            skel.hidden = true;
            content.hidden = false;
            requestAnimationFrame(() => content.classList.add('is-shown'));
          }, reduceMotion ? 0 : 900);
        };
        run();
      }

      const statuses = ['new', 'progress', 'done'];
      phoneEl.querySelector('.anim-inbox-cycle')?.addEventListener('click', () => {
        phoneEl.querySelectorAll('.anim-inbox-row').forEach((row) => {

      phoneEl.querySelector('.anim-search-toggle')?.addEventListener('click', () => {

      phoneEl.querySelector('.anim-refresh-run')?.addEventListener('click', () => {
        const ring = phoneEl.querySelector('.anim-refresh-ring');

      phoneEl.querySelector('.anim-success-btn')?.addEventListener('click', () => {

          toast.hidden = true;

      phoneEl.querySelector('.anim-theme-toggle')?.addEventListener('click', () => {
        phoneEl.classList.add('theme-fading');
        setTimeout(() => {
          phoneEl.classList.toggle('phone-light');
          phoneEl.classList.toggle('phone-dark');
          phoneEl.classList.remove('theme-fading');
        }, reduceMotion ? 0 : 180);
      });

      const scroll = phoneEl.querySelector('.category-scroll');
      if (phoneEl.dataset.anim === 'anim-parallax' && scroll && !reduceMotion) {
        scroll.addEventListener('scroll', () => {
          scroll.querySelectorAll('.anim-parallax-card').forEach((card) => {
            const bg = card.querySelector('.anim-parallax-bg');
            if (!bg) return;
            const y = Math.max(-6, Math.min(6, (card.offsetTop - scroll.scrollTop) * 0.04));
            bg.style.transform = `translateY(${y}px) scale(1.06)`;
          });
        }, { passive: true });
      }
    });

    /* V72 Globe-catalog: width shrinks away from vertical center */
    function updateGlobe(scrollEl) {
      const catalog = scrollEl.querySelector('.globe-catalog');
      if (!catalog) return;
      const tiles = catalog.querySelectorAll('.globe-tile');
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const scrollRect = scrollEl.getBoundingClientRect();
      const viewCenter = scrollRect.top + scrollRect.height / 2;
      const radius = Math.max(scrollRect.height * 0.52, 1);

      tiles.forEach((tile) => {
        if (reduce) {
          tile.style.transform = 'none';
          tile.style.opacity = '1';
          return;
        }
        const rect = tile.getBoundingClientRect();
        const tileCenter = rect.top + rect.height / 2;
        const dist = Math.abs(tileCenter - viewCenter);
        const t = Math.min(1, dist / radius);
        const curve = t * t;
        const scaleX = 1 - curve * 0.36;
        const scaleY = 1 - curve * 0.08;
        const opacity = 1 - curve * 0.3;
        tile.style.transform = `scale(${scaleX}, ${scaleY})`;
        tile.style.opacity = String(opacity);
      });
    }

    document.querySelectorAll('.globe-phone .category-scroll').forEach((scrollEl) => {
      let ticking = false;
      const run = () => updateGlobe(scrollEl);
      const onScroll = () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          run();
          ticking = false;
        });
      };
      run();
      scrollEl.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', run);
    });

    /* Horizontal globe / focus highlight on story rails */
    function updateHGlobe(row) {
      const cards = row.querySelectorAll('.story-hglobe-card');
      if (!cards.length) return;
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const mode = [...row.classList].find((c) => c.startsWith('hglobe-'))?.replace('hglobe-', '') || 'scale';
      const rowRect = row.getBoundingClientRect();
      const centerX = rowRect.left + rowRect.width / 2;
      const radius = Math.max(rowRect.width * 0.48, 1);

      cards.forEach((card) => {
        if (reduce) {
          card.style.transform = '';
          card.style.opacity = '';
          card.style.filter = '';
          return;
        }
        const rect = card.getBoundingClientRect();
        const cardCenter = rect.left + rect.width / 2;
        const dist = Math.abs(cardCenter - centerX);
        const t = Math.min(1, dist / radius);
        const curve = t * t;

        if (mode === 'fade') {
          card.style.transform = `scale(${1 - curve * 0.12})`;
          card.style.opacity = String(1 - curve * 0.55);
          card.style.filter = `brightness(${1 - curve * 0.35})`;
        } else if (mode === 'coverflow') {
          const dir = cardCenter < centerX ? 1 : -1;
          card.style.transform = `perspective(600px) rotateY(${dir * curve * 28}deg) scale(${1 - curve * 0.15})`;
          card.style.opacity = String(1 - curve * 0.35);
          card.style.filter = '';
        } else if (mode === 'lift') {
          card.style.transform = `translateY(${curve * 18}px) scale(${1 - curve * 0.14})`;
          card.style.opacity = String(1 - curve * 0.25);
          card.style.filter = '';
        } else if (mode === 'meridian') {
          card.style.transform = `scale(${1 - curve * 0.06}, ${1 - curve * 0.38})`;
          card.style.opacity = String(1 - curve * 0.22);
          card.style.filter = '';
        } else {
          /* scale */
          card.style.transform = `scale(${1 - curve * 0.32})`;
          card.style.opacity = String(1 - curve * 0.2);
          card.style.filter = '';
        }
      });
    }

    document.querySelectorAll('.hglobe-phone .stories-hglobe-row').forEach((row) => {
      let ticking = false;
      const run = () => updateHGlobe(row);
      const onScroll = () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          run();
          ticking = false;
        });
      };
      run();
      row.addEventListener('scroll', onScroll, { passive: true });
      const parentScroll = row.closest('.category-scroll');
      parentScroll?.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', run);
    });

    /* Wide-Globe: shrink + darken edges */
    function updateWGlobe(row) {
      const cards = row.querySelectorAll('.story-wglobe-card');
      if (!cards.length) return;
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const rowRect = row.getBoundingClientRect();
      const centerX = rowRect.left + rowRect.width / 2;
      const radius = Math.max(rowRect.width * 0.5, 1);

      cards.forEach((card) => {
        if (reduce) {
          card.style.transform = '';
          card.style.opacity = '';
          card.style.filter = '';
          return;
        }
        const rect = card.getBoundingClientRect();
        const cardCenter = rect.left + rect.width / 2;
        const dist = Math.abs(cardCenter - centerX);
        const t = Math.min(1, dist / radius);
        const curve = t * t;
        card.style.transform = `scale(${1 - curve * 0.22})`;
        card.style.opacity = String(1 - curve * 0.45);
        card.style.filter = `brightness(${1 - curve * 0.42})`;
      });
    }

    document.querySelectorAll('.wglobe-phone .stories-wglobe-row').forEach((row) => {
      let ticking = false;
      const run = () => updateWGlobe(row);
      const onScroll = () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          run();
          ticking = false;
        });
      };
      run();
      row.addEventListener('scroll', onScroll, { passive: true });
      row.closest('.category-scroll')?.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', run);
    });

    /* Category tabs on top */
    document.querySelectorAll('.tabs-phone').forEach((phoneEl) => {
      const body = phoneEl.dataset.body || 'grid';
      const panel = phoneEl.querySelector('.tabs-body-panel');
      const row = phoneEl.querySelector('.cat-tabs-row');
      if (!row) return;
      row.addEventListener('click', (e) => {
        const tab = e.target.closest('.cat-tab');
        if (!tab) return;
        row.querySelectorAll('.cat-tab').forEach((t) => t.classList.remove('on'));
        tab.classList.add('on');
        if (!panel) return;
        const idx = Number(tab.dataset.cat) || 0;
        panel.innerHTML = tabsBodyContent(body, idx);
        panel.querySelectorAll('.stories-wglobe-row').forEach((r) => {
          updateWGlobe(r);
          r.addEventListener('scroll', () => updateWGlobe(r), { passive: true });
        });
        panel.querySelectorAll('.stories-hglobe-row').forEach((r) => {
          updateHGlobe(r);
          r.addEventListener('scroll', () => updateHGlobe(r), { passive: true });
        });
      });
    });

    /* Plane trail — tile stays put */
    document.querySelectorAll('.plane-phone').forEach((phoneEl) => {
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      phoneEl.querySelectorAll('.plane-tile').forEach((tile) => {
        tile.addEventListener('click', () => {
          if (tile.classList.contains('is-flying')) return;
          tile.classList.add('is-flying');
          if (reduce) {
            setTimeout(() => tile.classList.remove('is-flying'), 400);
            return;
          }
          const onEnd = (e) => {
            if (e.target !== tile.querySelector('.plane-glyph')) return;
            tile.removeEventListener('animationend', onEnd);
            tile.classList.remove('is-flying');
          };
          tile.addEventListener('animationend', onEnd);
          /* fallback if animationend misses */
          setTimeout(() => tile.classList.remove('is-flying'), 900);
        });
      });
    });
  </script>
</body>
</html>
