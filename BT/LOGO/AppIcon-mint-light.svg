<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" shape-rendering="geometricPrecision">
  <rect width="1024" height="1024" fill="#f7fcf9"/>
  <defs>
    <linearGradient id="outer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a5a6e"/>
      <stop offset="100%" stop-color="#c9a86a"/>
    </linearGradient>
    <!-- reverse of outer: gold ? teal, multi-stop along arc -->
    <linearGradient id="innerTop" gradientUnits="userSpaceOnUse" x1="154" y1="492" x2="870" y2="492">
      <stop offset="0%" stop-color="#c9a86a"/>
      <stop offset="35%" stop-color="#7eb8a8"/>
      <stop offset="70%" stop-color="#2a8aa0"/>
      <stop offset="100%" stop-color="#1a5a6e"/>
    </linearGradient>
    <linearGradient id="innerBot" gradientUnits="userSpaceOnUse" x1="870" y1="492" x2="154" y2="492">
      <stop offset="0%" stop-color="#c9a86a"/>
      <stop offset="40%" stop-color="#a8b4b8"/>
      <stop offset="75%" stop-color="#4a7a88"/>
      <stop offset="100%" stop-color="#1a5a6e"/>
    </linearGradient>
  </defs>
  <circle cx="512" cy="492" r="420" fill="none" stroke="url(#outer)" stroke-width="31"/>
  <path d="M870 492 A358 358 0 0 1 154 492" fill="none" stroke="url(#innerBot)" stroke-width="22" stroke-linecap="butt"/>
  <path d="M154 492 A358 358 0 0 1 870 492" fill="none" stroke="url(#innerTop)" stroke-width="44" stroke-linecap="butt"/>
  <text x="512" y="465" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="170" fill="#0e2436" font-weight="700">&#1052;&#1054;&#1049;</text>
  <text x="512" y="655" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="170" fill="#1a5a6e" font-weight="700">TLS</text>
</svg>
